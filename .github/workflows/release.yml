# Release pipeline (every push to main, or Actions -> Release -> Run):
#   CI (tests, lint, Trivy, Checkov, Helm) -> build immutable image (commit SHA) -> Trivy gate -> push to ECR
#   -> dev:  helm upgrade --atomic into opsdesk-dev -> smoke test -> automatic rollback on failure
#   -> [approval: GitHub environment "prod"] -> prod: the SAME image into opsdesk-prod -> smoke -> rollback
# If the AWS environment is down (destroyed for the night), build/deploy are skipped with a notice.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read
  security-events: write

concurrency:
  group: aws-release
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.12.2
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  environment:
    name: Is the AWS environment up?
    needs: ci
    if: vars.AWS_ROLE_ARN != '' # skipped until the AWS bootstrap is done
    runs-on: ubuntu-latest
    outputs:
      up: ${{ steps.check.outputs.up }}
      repo: ${{ steps.check.outputs.repo }}
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - id: check
        run: |
          # "Up" means a COMPLETE Infrastructure apply: the cluster exists AND both Terraform roots wrote their
          # helm_values output (a failed or half-finished apply leaves the cluster but not the outputs).
          bucket="opsdesk-tfstate-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}"
          outputs_ok() { aws s3 cp "s3://${bucket}/opsdesk/$1.tfstate" - 2>/dev/null | jq -e '.outputs.helm_values' >/dev/null; }
          if aws eks describe-cluster --name opsdesk >/dev/null 2>&1 \
             && outputs_ok infra && outputs_ok platform \
             && repo=$(aws ecr describe-repositories --repository-names opsdesk --query 'repositories[0].repositoryUri' --output text 2>/dev/null); then
            echo "up=true" >> "$GITHUB_OUTPUT"; echo "repo=$repo" >> "$GITHUB_OUTPUT"
          else
            echo "up=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy skipped::AWS environment is down or the last Infrastructure apply did not finish. Run Infrastructure (apply) until it is green, then re-run Release."
          fi

  build:
    name: Build, scan, push
    needs: environment
    if: needs.environment.outputs.up == 'true'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Build (immutable tag = commit SHA)
        run: |
          docker build --platform linux/amd64 \
            --label org.opencontainers.image.revision="$GITHUB_SHA" \
            -t "${{ needs.environment.outputs.repo }}:${{ steps.meta.outputs.tag }}" app
      - name: Trivy gate (fixable CRITICAL/HIGH block the release)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$TRIVY_IMAGE" image \
            --severity CRITICAL,HIGH --ignore-unfixed --exit-code 1 \
            "${{ needs.environment.outputs.repo }}:${{ steps.meta.outputs.tag }}"
      - name: Push to ECR
        run: docker push "${{ needs.environment.outputs.repo }}:${{ steps.meta.outputs.tag }}"
      - name: ECR scan-on-push result
        run: |
          aws ecr wait image-scan-complete --repository-name opsdesk --image-id imageTag=${{ steps.meta.outputs.tag }} || true
          aws ecr describe-image-scan-findings --repository-name opsdesk --image-id imageTag=${{ steps.meta.outputs.tag }} \
            --query 'imageScanFindings.findingSeverityCounts' --output table || true

  deploy-dev:
    name: Deploy to dev
    needs: [environment, build]
    runs-on: ubuntu-latest
    environment: dev # no reviewer: every green build of main lands in dev
    timeout-minutes: 30
    env:
      APP_ENV: dev
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: helm upgrade --atomic + smoke test (opsdesk-dev)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: bash scripts/aws/deploy-app.sh --no-build
      - name: Roll back on failure
        if: failure()
        run: |
          source scripts/aws/lib.sh
          kubeconfig
          # First deploy into an empty namespace: --atomic already removed the failed release, nothing to roll back
          if ! helm status opsdesk -n "$APP_NS" >/dev/null 2>&1; then
            echo "::warning::dev: no previous release to roll back to (first deploy). Fix the error above and re-run."
            exit 0
          fi
          helm rollback opsdesk 0 -n "$APP_NS" --wait && echo "::warning::dev rolled back to the previous release"
          helm history opsdesk -n "$APP_NS" --max 5
      - name: Summary
        if: success()
        run: |
          source scripts/aws/lib.sh
          kubeconfig
          host=$(kubectl -n "$APP_NS" get ingress opsdesk-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          {
            echo "### dev: opsdesk:${{ needs.build.outputs.tag }}"
            echo "- Web UI: http://${host}/"
            echo "- Grafana: http://${host}/grafana (Environment dropdown: opsdesk-dev; login in Secrets Manager \`opsdesk/grafana\`)"
            echo "- Next: approve **Deploy to prod** to promote this exact image"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Promote to prod
    needs: [build, deploy-dev]
    runs-on: ubuntu-latest
    environment: prod # required reviewer: promotion of the image dev already runs
    timeout-minutes: 30
    env:
      APP_ENV: prod
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: azure/setup-helm@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: helm upgrade --atomic + smoke test (opsdesk-prod)
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: bash scripts/aws/deploy-app.sh --no-build
      - name: Roll back on failure
        if: failure()
        run: |
          source scripts/aws/lib.sh
          kubeconfig
          # First deploy into an empty namespace: --atomic already removed the failed release, nothing to roll back
          if ! helm status opsdesk -n "$APP_NS" >/dev/null 2>&1; then
            echo "::warning::prod: no previous release to roll back to (first deploy). Fix the error above and re-run."
            exit 0
          fi
          helm rollback opsdesk 0 -n "$APP_NS" --wait && echo "::warning::prod rolled back to the previous release"
          helm history opsdesk -n "$APP_NS" --max 5
      - name: Summary
        if: success()
        run: |
          source scripts/aws/lib.sh
          kubeconfig
          host=$(kubectl -n "$APP_NS" get ingress opsdesk-api -o jsonpath='{.status.loadBalancer.ingress[0].hostname}')
          {
            echo "### prod: opsdesk:${{ needs.build.outputs.tag }} (same image as dev)"
            echo "- Web UI: http://${host}/"
            echo "- Grafana: http://${host}/grafana (login in Secrets Manager \`opsdesk/grafana\`)"
            echo "- Rollback: Actions -> Ops -> environment prod -> rollback"
          } >> "$GITHUB_STEP_SUMMARY"
