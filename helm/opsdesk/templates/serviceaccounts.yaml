{{- range $component := list "api" "worker" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsdesk.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with (index $.Values.serviceAccount $component).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
