{{- $components := list "api" "worker" }}
{{- if .Values.externalSecrets.enabled }}
{{- /* "secrets": the identity External Secrets uses to read THIS environment's secrets (IRSA, this namespace only) */}}
{{- $components = append $components "secrets" }}
{{- end }}
{{- range $component := $components }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "opsdesk.fullname" $ }}-{{ $component }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $component }}
  {{- with (index $.Values.serviceAccount $component).annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
