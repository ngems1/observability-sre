{{- if .Values.externalSecrets.enabled }}
# Secrets come from AWS Secrets Manager through External Secrets Operator. The SecretStore authenticates with
# the <release>-secrets service account of THIS namespace (IRSA role trusted only here), so one environment
# can never read another environment's secrets; the ESO controller itself has no AWS permissions.
#  - DB credentials: the RDS-managed master secret (rotatable; never in Git or Terraform state)
#  - app secret: bootstrap API keys, optional Slack webhook, Alertmanager webhook bearer token
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ include "opsdesk.fullname" . }}-aws
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required "externalSecrets.region is required" .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ include "opsdesk.fullname" . }}-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "opsdesk.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ include "opsdesk.fullname" . }}-aws
  target:
    name: {{ include "opsdesk.secretName" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPSDESK_DATABASE_URL: {{ printf "postgresql+psycopg://{{ .db_username }}:{{ .db_password | urlquery }}@%s:5432/%s?sslmode=require" .Values.externalSecrets.dbHost .Values.externalSecrets.dbName | quote }}
        OPSDESK_BOOTSTRAP_USERS: {{ `"{{ .bootstrap_users }}"` }}
        OPSDESK_SLACK_WEBHOOK_URL: {{ `"{{ .slack_webhook_url }}"` }}
        OPSDESK_ALERT_WEBHOOK_TOKEN: {{ `"{{ .alert_webhook_token }}"` }}
  data:
    - secretKey: db_username
      remoteRef:
        key: {{ required "externalSecrets.dbSecretArn is required" .Values.externalSecrets.dbSecretArn }}
        property: username
    - secretKey: db_password
      remoteRef:
        key: {{ .Values.externalSecrets.dbSecretArn }}
        property: password
    - secretKey: bootstrap_users
      remoteRef:
        key: {{ required "externalSecrets.appSecretName is required" .Values.externalSecrets.appSecretName }}
        property: bootstrap_users
    - secretKey: slack_webhook_url
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretName }}
        property: slack_webhook_url
    - secretKey: alert_webhook_token
      remoteRef:
        key: {{ .Values.externalSecrets.appSecretName }}
        property: alert_webhook_token
{{- end }}
