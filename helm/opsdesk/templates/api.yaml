{{- $ctx := dict "root" . "component" "api" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opsdesk.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
  annotations:
    # Checkov exceptions (justified; see docs/security/findings.md)
    checkov.io/skip1: CKV_K8S_11=No CPU limit on purpose - CPU limits cause throttling; requests + HPA size the workload
    checkov.io/skip2: CKV_K8S_43=ECR tags are immutable (commit SHA), so a tag pins one image like a digest
    checkov.io/skip3: CKV_K8S_15=IfNotPresent is safe with immutable tags and avoids an ECR pull per pod start
    checkov.io/skip4: CKV_K8S_35=12-factor env config; values come from External Secrets and rotate on pod restart
spec:
  {{- if not .Values.api.hpa.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0          # a broken release never removes the healthy pods (drill 5)
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $ctx | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "opsdesk.selectorLabels" $ctx | nindent 8 }}
        app.kubernetes.io/version: {{ .Values.image.tag | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ include "opsdesk.fullname" . }}-api
      automountServiceAccountToken: false   # IRSA mounts its own projected token
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.api.migrateOnStart }}
      initContainers:
        - name: migrate
          image: {{ include "opsdesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "opsdesk.migrate"]
          envFrom:
            {{- include "opsdesk.envFrom" . | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 256Mi }
      {{- end }}
      containers:
        - name: api
          image: {{ include "opsdesk.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            {{- include "opsdesk.envFrom" . | nindent 12 }}
          env:
            - name: OPSDESK_SERVICE_NAME
              value: ticket-api
            {{- include "opsdesk.chaosEnv" . | nindent 12 }}
            {{- with .Values.api.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 5
            timeoutSeconds: 4            # DB check uses a 3 s connect timeout
            failureThreshold: 2
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      terminationGracePeriodSeconds: 20
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "opsdesk.selectorLabels" $ctx | nindent 14 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opsdesk.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    {{- include "opsdesk.selectorLabels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.api.service.port }}
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opsdesk.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  minAvailable: {{ .Values.api.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $ctx | nindent 6 }}
{{- if .Values.api.hpa.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "opsdesk.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "opsdesk.fullname" . }}-api
  minReplicas: {{ .Values.api.hpa.minReplicas }}
  maxReplicas: {{ .Values.api.hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ .Values.api.hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "opsdesk.fullname" . }}-api
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - {{- with .Values.ingress.host }}
      host: {{ . }}
      {{- end }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "opsdesk.fullname" . }}-api
                port:
                  name: http
{{- end }}
