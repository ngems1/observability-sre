{{- if .Values.networkPolicy.enabled }}
{{- $api := dict "root" . "component" "api" -}}
{{- $worker := dict "root" . "component" "worker" -}}
# 1. Default deny for every OpsDesk pod in this release
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
# 2. ticket-api: HTTP in from anywhere in the cluster / ALB, metrics from monitoring
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $api | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
---
# 3. ticket-worker: only its metrics/health port is reachable (Prometheus scrapes, kubelet probes).
#    No "from" selector: on EKS the VPC CNI evaluates kubelet probes from the node IP, so a
#    namespace-only rule would fail the liveness probe. The port serves /metrics and /healthz only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-worker-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $worker | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.worker.metricsPort }}
          protocol: TCP
---
# 4. Egress: DNS + the dependency ports only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
