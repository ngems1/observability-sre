{{- if .Values.networkPolicy.enabled }}
{{- $api := dict "root" . "component" "api" -}}
{{- $worker := dict "root" . "component" "worker" -}}
# 1. Default deny for every OpsDesk pod in this release
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-default-deny
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Ingress, Egress]
---
# 2. ticket-api: only from its own namespace (k6, drills), the observability namespace (Prometheus scrapes,
#    Alertmanager webhook) and the load balancer subnets (ALB, ip targets). Never from another environment.
#    Kubelet probes come from the node IP, which the VPC CNI network policy agent allows automatically.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-api-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $api | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.api.port }}
          protocol: TCP
      from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range concat .Values.networkPolicy.loadBalancerCidrs .Values.networkPolicy.extraIngressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
---
# 3. ticket-worker: only its metrics/health port, only from its own namespace and the observability namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-worker-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "opsdesk.selectorLabels" $worker | nindent 6 }}
  policyTypes: [Ingress]
  ingress:
    - ports:
        - port: {{ .Values.worker.metricsPort }}
          protocol: TCP
      from:
        - podSelector: {}
        {{- range .Values.networkPolicy.ingressFromNamespaces }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ . }}
        {{- end }}
        {{- range .Values.networkPolicy.extraIngressCidrs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
---
# 4. Egress: DNS + the dependency ports only
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "opsdesk.fullname" . }}-egress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opsdesk.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
  policyTypes: [Egress]
  egress:
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    - ports:
        {{- range .Values.networkPolicy.egressPorts }}
        - port: {{ . }}
          protocol: TCP
        {{- end }}
{{- end }}
