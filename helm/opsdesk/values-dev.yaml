# dev: deployed automatically on every push to main. Small, cheap, the place to run failure drills.
config:
  OPSDESK_ENVIRONMENT: dev           # shown as a DEV badge in the web UI

api:
  replicas: 1
  hpa:
    enabled: true
    minReplicas: 1
    maxReplicas: 3
  pdb:
    minAvailable: 0                  # single replica in dev: allow node drains

worker:
  replicas: 2                         # 1 worker could not drain 5 req/s of k6 load (40K backlog, 2026-10-12)
