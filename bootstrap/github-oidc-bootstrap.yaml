AWSTemplateFormatVersion: "2010-09-09"
Description: >
  OpsDesk one-time bootstrap (run once, from the AWS console - nothing local).
  Creates the GitHub Actions OIDC trust, the deploy role GitHub Actions assumes with short-lived
  credentials (no long-lived AWS keys anywhere), and the S3 bucket that holds Terraform state.
  Console: CloudFormation -> Create stack -> With new resources -> Upload a template file.

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organization that owns the repository (e.g. ngems1)
  GitHubRepo:
    Type: String
    Default: opsdesk
    Description: Repository name
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      "false" if this account already has an IAM OIDC provider for token.actions.githubusercontent.com
      (IAM -> Identity providers). Only one can exist per account.

Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      # AWS validates GitHub's certificate itself; the thumbprint is kept for older API callers
      ThumbprintList: [6938fd4d98bab03faadb97b34396831e3780aea1]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: opsdesk-github-deploy
      Description: Assumed by GitHub Actions (OIDC) for the opsdesk repository only
      MaxSessionDuration: 7200 # EKS creation can take ~20 min; 2 h covers infra + platform
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOIDCProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # main branch, pull requests and the protected "demo" environment of THIS repo only
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:ref:refs/heads/main
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:pull_request
                  - !Sub repo:${GitHubOwner}/${GitHubRepo}:environment:demo
      # Terraform creates IAM roles, VPCs, EKS, RDS... For this single-purpose lab account the deploy role is admin.
      # Documented gap in docs/security/findings.md: split into plan (read-only) and apply roles with a
      # permissions boundary for production.
      ManagedPolicyArns:
        - !Sub arn:${AWS::Partition}:iam::aws:policy/AdministratorAccess
      Tags:
        - { Key: Project, Value: opsdesk }
        - { Key: ManagedBy, Value: cloudformation }

  StateBucket:
    Type: AWS::S3::Bucket
    Metadata:
      checkov:
        skip:
          - id: CKV_AWS_18
            comment: Access logging for the state bucket needs a second bucket; out of demo scope (versioning + TLS-only policy)
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub opsdesk-tfstate-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration: { Status: Enabled }
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: aws:kms }
            BucketKeyEnabled: true
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-state-versions
            Status: Enabled
            NoncurrentVersionExpiration: { NoncurrentDays: 30 }
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 7 }
      Tags:
        - { Key: Project, Value: opsdesk }
        - { Key: Component, Value: tf-state }

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub ${StateBucket.Arn}/*
            Condition:
              Bool: { aws:SecureTransport: "false" }

Outputs:
  DeployRoleArn:
    Description: Put this in the GitHub repository variable AWS_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  StateBucketName:
    Description: Terraform state bucket (the workflows derive the same name automatically)
    Value: !Ref StateBucket
